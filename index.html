<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brandon Li + Seoyoung Sung | Valentine's Day</title>
    <meta
      name="description"
      content="A Valentine's Day photo gallery for Brandon Li and Seoyoung Sung."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow glow-left" aria-hidden="true"></div>
    <div class="glow glow-right" aria-hidden="true"></div>

    <div class="hearts-container" id="hearts" aria-hidden="true"></div>

    <main class="page">
      <section class="hero reveal" id="top">
        <p class="kicker">February 14, 2026</p>
        <h1>
          Happy Valentine's Day
          <span class="heart-accent" aria-hidden="true">&#9829;</span>
        </h1>
        <p class="subline">For Brandon &amp; Seoyoung, with love.</p>
      </section>

      <section class="gallery" aria-label="Photo gallery">
        <figure class="photo-frame featured reveal">
          <button
            type="button"
            class="photo-button"
            data-lightbox-src="IMG_0161.jpeg"
            data-lightbox-alt="Brandon and Seoyoung"
            aria-label="View photo fullscreen"
          >
            <img
              class="photo-image"
              src="IMG_0161.jpeg"
              alt="Brandon and Seoyoung"
              decoding="async"
            />
          </button>
        </figure>

        <div class="photo-grid">
          <figure class="photo-frame reveal">
            <button
              type="button"
              class="photo-button"
              data-lightbox-src="IMG_0458.jpeg"
              data-lightbox-alt="Brandon and Seoyoung"
              aria-label="View photo fullscreen"
            >
              <img
                class="photo-image"
                src="IMG_0458.jpeg"
                alt="Brandon and Seoyoung"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>

          <figure class="photo-frame reveal">
            <button
              type="button"
              class="photo-button"
              data-lightbox-src="IMG_0480.jpeg"
              data-lightbox-alt="Brandon and Seoyoung"
              aria-label="View photo fullscreen"
            >
              <img
                class="photo-image"
                src="IMG_0480.jpeg"
                alt="Brandon and Seoyoung"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>

          <figure class="photo-frame reveal">
            <button
              type="button"
              class="photo-button"
              data-lightbox-src="lp_image.jpeg"
              data-lightbox-alt="Brandon and Seoyoung"
              aria-label="View photo fullscreen"
            >
              <img
                class="photo-image"
                src="lp_image.jpeg"
                alt="Brandon and Seoyoung"
                loading="lazy"
                decoding="async"
              />
            </button>
          </figure>
        </div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <button
        type="button"
        class="lightbox-close"
        id="lightbox-close"
        aria-label="Close fullscreen photo"
      >
        Close
      </button>
      <div
        class="lightbox-stage"
        role="dialog"
        aria-modal="true"
        aria-label="Fullscreen photo"
      >
        <img id="lightbox-image" class="lightbox-image" src="" alt="" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
